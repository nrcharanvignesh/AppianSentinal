name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python scripts/install_dev.py
      - name: Ruff
        run: python -m ruff check appian_sentinel tests tools
      - name: Pytest (includes synthetic scale gates)
        run: python -m pytest -q
